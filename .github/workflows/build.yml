name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build

      - name: Enviar o .jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: white_monkey-jar
          path: build/libs/*.jar
