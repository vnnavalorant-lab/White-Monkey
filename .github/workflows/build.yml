name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar o Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Enviar o .jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: white_monkey-jar
          path: build/libs/*.jar
